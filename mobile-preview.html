<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile & Tablet Live Preview | R J Chemicals Canada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #0C1D3D 0%, #040811 70%);
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
    }
    .phone-shell {
      width: 405px;
      height: 840px;
      border-radius: 52px;
      border: 12px solid #1E293B;
      box-shadow: 0 30px 80px -15px rgba(0, 210, 255, 0.28), 0 0 0 2px #38BDF8;
      background: #040811;
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
    }
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 24px;
      background: #000;
      border-radius: 999px;
      z-index: 20;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Controls Bar -->
  <header class="bg-[#070E1E]/90 backdrop-blur-md border-b border-sky-500/25 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <img src="assets/logo-phoenix-clean.png" alt="Logo" class="h-10 w-auto" />
      <div>
        <div class="font-bold text-white text-sm sm:text-base">R J Chemicals Canada • Interactive Mobile Phone Preview</div>
        <div class="text-xs text-sky-400 font-mono">Scroll inside the phone screen below or test the mobile hamburger menu (☰)</div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2.5">
      <button onclick="setDevice(405, 840, 'index.html')" id="btn-home" class="px-3.5 py-2 rounded-xl bg-sky-400 text-slate-950 font-mono text-xs font-bold transition">
        📱 iPhone 16 Pro (Home Page)
      </button>
      <button onclick="setDevice(405, 840, 'videos.html')" id="btn-vid" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 font-mono text-xs hover:border-sky-400 transition">
        📱 iPhone 16 Pro (Video Library)
      </button>
      <button onclick="setDevice(768, 860, 'index.html')" id="btn-pad" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 font-mono text-xs hover:border-sky-400 transition">
        📟 iPad / Tablet View
      </button>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-mono text-xs font-bold transition">
        ← Back to Full Desktop View
      </a>
    </div>
  </header>

  <!-- Main Simulator Stage -->
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <div id="deviceShell" class="phone-shell">
      <iframe id="previewFrame" src="index.html" class="w-full h-full border-0" title="Mobile Phone Preview"></iframe>
    </div>
  </main>

  <script>
    function setDevice(w, h, url) {
      const shell = document.getElementById('deviceShell');
      const frame = document.getElementById('previewFrame');
      shell.style.width = w + 'px';
      shell.style.height = h + 'px';
      if (frame.getAttribute('src') !== url) {
        frame.src = url;
      }
    }
  </script>
</body>
</html>
