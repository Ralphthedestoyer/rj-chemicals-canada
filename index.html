  <style>
    :root {
      --phoenix-cyan: #00D2FF;
      --phoenix-blue: #0088FF;
    }
    body {
      background-color: #040811;
      color: #F8FAFC;
      overflow-x: hidden;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #040811; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 5px; border: 2px solid #040811; }
    ::-webkit-scrollbar-thumb:hover { background: #00D2FF; }

    /* Ambient Mesh Glows */
    .hero-glow {
      background:
        radial-gradient(circle at 18% 22%, rgba(0, 210, 255, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(0, 136, 255, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
    }
    .glass-card {
      background: rgba(11, 22, 44, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.16);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(0, 210, 255, 0.45);
      box-shadow: 0 20px 45px -15px rgba(0, 210, 255, 0.18), 0 0 25px -5px rgba(0, 136, 255, 0.15);
      transform: translateY(-4px);
    }
    .phoenix-gradient-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #7DD3FC 45%, #00D2FF 75%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .phoenix-btn {
      background: linear-gradient(135deg, #00D2FF 0%, #0072FF 100%);
      box-shadow: 0 10px 30px -5px rgba(0, 180, 255, 0.45);
      transition: all 0.25s ease;
    }
    .phoenix-btn:hover {
      box-shadow: 0 15px 35px -3px rgba(0, 210, 255, 0.65);
      transform: translateY(-2px) scale(1.01);
    }
    .grid-bg {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: floatSlow 5s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      border: 2px solid #00D2FF;
      animation: pulseRing 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    /* Before/After Slider */
    .ba-container {
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .ba-after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .ba-before {
      position: absolute;
      inset: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
    }
    /* Smooth Scroll-Reveal Choreography */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px) scale(0.985);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    /* Glowing Stat Counter Card Pop */
    .stat-pop-card {
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stat-pop-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.16), transparent 65%);
      pointer-events: none;
    }
    .stat-pop-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 210, 255, 0.55);
      box-shadow: 0 18px 40px -12px rgba(0, 210, 255, 0.22);
    }
    /* Cursor-Tracking Spotlight Glow on Glass Cards */
    .glass-card {
      position: relative;
      overflow: hidden;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mouse-x, 50%) var(--mouse-y, 0%),
        rgba(0, 210, 255, 0.14),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 0;
    }
    .glass-card:hover::before {
      opacity: 1;
    }
    .glass-card > * {
      position: relative;
      z-index: 1;
    }
    /* Prevent any Grid or Flex item from forcing horizontal overflow on mobile */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    .grid > * {
      min-width: 0;
      max-width: 100%;
    }
    p, h1, h2, h3, h4, span, a, div {
      overflow-wrap: break-word;
    }
    /* Mobile Quick-Scroll Horizontal Swipe Rows (< 768px) */
    @media (max-width: 767px) {
      .mobile-swipe-row {
        display: flex !important;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 14px;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
      }
      .mobile-swipe-row::-webkit-scrollbar {
        display: none;
      }
      .mobile-swipe-row > * {
        min-width: 85%;
        max-width: 85%;
        scroll-snap-align: center;
        flex-shrink: 0;
        user-select: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    }
  </style>
